<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7a1f2b">
<title>Entrando — BoraDiploma</title>
<meta property="og:title" content="BoraDiploma — seu acesso">
<meta property="og:description" content="Toque para entrar no BoraDiploma (15 dias gratis).">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#f5f3ee;--surface:#fffdf8;--fg:#1f1b16;--muted:#6b6459;--line:#e2ddd2;--accent:#7a1f2b}
  @media (prefers-color-scheme:dark){:root{--bg:#17150f;--surface:#211e17;--fg:#ece7dc;--muted:#a79f90;--line:#352f25;--accent:#e4a0a0;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  .box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 24px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.12)}
  h1{color:var(--accent);font-size:24px;margin:0 0 8px}
  p{color:var(--muted);font-size:15px;line-height:1.5;margin:8px 0}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:16px auto;animation:g 1s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  button,a.btn{display:inline-block;width:100%;padding:12px;font-size:16px;border:0;border-radius:10px;cursor:pointer;margin-top:14px;background:var(--accent);color:#fff;text-decoration:none}
</style>
<div class="box">
  <h1>BoraDiploma</h1>
  <div id="spin" class="spin"></div>
  <p id="msg">Entrando…</p>
  <div id="acts"></div>
</div>
<script>
(function(){
  var SB_URL = 'https://epumhsiqdxvcboisurvu.supabase.co';
  var SB_KEY = 'sb_publishable_JW7iq8Kayqkp3OL--TCccg_aTBKOs_S';
  var msg = document.getElementById('msg');
  var spin = document.getElementById('spin');
  var acts = document.getElementById('acts');
  function stop(){ if(spin) spin.style.display='none'; }
  function erro(txt){ stop(); msg.innerHTML = txt; acts.innerHTML = '<a class="btn" href="app.html">Ir para o app</a>'; }

  var t = new URLSearchParams(location.search).get('t');
  if(!t){ erro('Link invalido. Peca um novo acesso ao responsavel. 🙏'); return; }
  var sb; try{ sb = window.supabase.createClient(SB_URL, SB_KEY); }catch(e){}
  if(!sb){ erro('Voce precisa de internet. Recarregue a pagina.'); return; }

  function go(){ msg.textContent = 'Pronto! Abrindo o app…'; location.replace('app.html'); }
  function tryType(types, i){
    if(i >= types.length){ erro('Esse link expirou ou ja foi usado. Peca um novo acesso ao responsavel. 🙏'); return; }
    sb.auth.verifyOtp({ token_hash: t, type: types[i] }).then(function(r){
      if(r && !r.error && r.data && (r.data.session || r.data.user)){ go(); }
      else { tryType(types, i+1); }
    }).catch(function(){ tryType(types, i+1); });
  }
  tryType(['magiclink','email'], 0);
})();
</script>
</html>
